
services:
  postgres:
    image: postgres:15-alpine
    container_name: vizyonarc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-vizyonarc}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vizyonarc_pwd}
      POSTGRES_DB: ${DATABASE_NAME:-vizyonarc_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - vizyonarc-network

  redis:
    image: redis:7-alpine
    container_name: vizyonarc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-vizyonarc_redis}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - vizyonarc-network

  nginx:
    image: nginx:alpine
    container_name: vizyonarc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vizyonarc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vizyonarc-backend
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-vizyonarc_db}
      - DATABASE_USERNAME=${DATABASE_USER:-vizyonarc}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-vizyonarc_pwd}
      - NODE_ENV=development
    volumes:
      - ./backend:/opt/app
      - /opt/node_modules
    networks:
      - vizyonarc-network
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vizyonarc-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - vizyonarc-network

networks:
  vizyonarc-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
