# ==========================================
# Development Override for Docker Compose
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==========================================

services:
  backend:
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/opt/app
      - /opt/app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

